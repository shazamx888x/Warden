name: Warden red team

# The gate. A control that isn't re-tested on every change is one that used to
# work. It runs against the offline stand-ins, so it needs no key and no cloud
# account, which is the only way a gate like this survives a real team: the
# moment it needs a credential, someone turns it off.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  redteam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Generate the corpus
        run: python data/generator/generate_corpus.py --out data/corpus

      - name: Static checks
        run: python scripts/check_all.py --allow-missing-guide

      - name: The checks must still fire
        run: python scripts/check_negative.py
        env:
          PYTHONPATH: src

      - name: Red team, both targets, with the gate
        run: python eval/redteam.py --target gateway --fail-over 0.05
        env:
          PYTHONPATH: src

      - name: Utility must not regress
        run: python eval/utility.py --assert-answer-rate 0.95 --assert-boundary 1.0
        env:
          PYTHONPATH: src

      - name: PII detection must not regress
        run: python eval/pii_eval.py --engine regex --assert-recall 0.95
        env:
          PYTHONPATH: src

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warden-results
          path: results/
